version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: crypto-exchange-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crypto-network

  app:
    build: 
      context: .
      dockerfile: Dockerfile.prod
    container_name: crypto-exchange-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - QUEUE_REDIS_URL=redis://redis:6379
      - STATUS_REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - crypto-network

  workers:
    build: 
      context: .
      dockerfile: src/server/api/workers/Dockerfile
    container_name: crypto-exchange-workers
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - QUEUE_REDIS_URL=redis://redis:6379
      - STATUS_REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - crypto-network

volumes:
  redis_data:

networks:
  crypto-network:
    driver: bridge