services:
  redis:
    image: redis:alpine
    container_name: crypto-exchange-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crypto-network

  app:
    image: public.ecr.aws/q2z8v3n8/crypto-exchange:latest
    container_name: crypto-exchange-app
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      - QUEUE_REDIS_URL=redis://redis:6379
      - STATUS_REDIS_URL=redis://redis:6379
      - EXCHANGE_HOST=https://exchange.apexlab.dev
      - NEXT_PUBLIC_WEBSOCKET_CONNECTION_STRING=wss://streamer.cryptocompare.com/v2?api_key=92552f6adceacee65447af2bf869b66122fd27ea079b4df7432ff005fb559a32
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - /var/log/worker.log:/var/log/worker.log
    networks:
      - crypto-network

volumes:
  redis_data:

networks:
  crypto-network:
    driver: bridge